<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Is het dab season?</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      overflow: hidden;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px); }
      60% { transform: translateY(-7px); }
    }
    .main-word {
      font-size: 20vh;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: .02em;
    }
    .sub-text {
      font-size: 5vh;
      margin-top: 2vh;
      font-weight: 400;
      text-transform: uppercase;
      opacity: 0.7;
      animation: bounce 2s infinite;
    }
    .gif-image {
      margin-top: 3vh;
      max-height: 35vh;
      height: auto;
      border-radius: 10px;
    }
    @media (max-width: 400px) {
      .main-word { font-size: 25vh; }
      .sub-text { font-size: 6vh; }
      .gif-image { max-height: 30vh; }
    }
  </style>
</head>
<body>
  <div class="main-word">NEE</div>
  <div class="sub-text">HOLD YOUR DAB</div>
  <img src="https://media.giphy.com/media/fhLgA6nJec3Cw/giphy.gif" alt="Verdrietig kind" class="gif-image">
</body>
</html>
